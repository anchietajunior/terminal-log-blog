<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="site-brand">
    <span class="site-brand-mark" aria-hidden="true">JA</span>{{ site.title }}
  </a>
  <nav class="site-nav" aria-label="Principal">
    <a href="{{ '/posts/' | relative_url }}"{% if page.url contains '/posts' or page.layout == 'post' %} aria-current="page"{% endif %}>Posts</a>
    <a href="{{ '/sobre/' | relative_url }}"{% if page.url contains '/sobre' %} aria-current="page"{% endif %}>Sobre</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </nav>
</header>
